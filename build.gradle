import org.jetbrains.intellij.platform.gradle.TestFrameworkType

buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java'
    id 'antlr'
    id "org.jetbrains.intellij.platform" version "2.18.1"
}

wrapper {
    gradleVersion = '9.7.1'
}

group 'antlr'
version pluginVersion

def ideaVersionValue = findProperty("ideaVersion")?.toString()
if (!ideaVersionValue || !ideaVersionValue.contains("-")) {
    throw new GradleException("ideaVersion must follow <TYPE>-<VERSION> format (for example: IC-2022.3)")
}
def (platformType, platformVersion) = ideaVersionValue.split("-", 2)
def sinceBuildOverride = findProperty("sinceBuildVersion")?.toString()?.trim()
def untilBuildOverride = findProperty("untilBuildVersion")?.toString()?.trim()

// IntelliJ 2026.2 runs on JBR 25, so the plugin can use Java 25.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

intellijPlatform {
    buildSearchableOptions = false
    pluginConfiguration {
        id = 'org.antlr.intellij.plugin'
        version = project.version.toString()
        name = 'ANTLR v4'

        ideaVersion {
            sinceBuild = provider { sinceBuildOverride ?: null }
            untilBuild = provider { untilBuildOverride ?: null }
        }
    }
    // Verify against the IDE we build with. Without an explicit list, recommended() falls back
    // to an ancient release (2020.2.4) because sinceBuild above is left unset.
    pluginVerification {
        ides {
            create(platformType, platformVersion)
        }
        // The published ID 'org.antlr.intellij.plugin' predates the "no 'intellij' in IDs" rule
        // and can't change without orphaning existing installs.
        freeArgs = ["-mute", "TemplateWordInPluginId"]
    }
}

// antlr4-xl (git submodule): grammar tooling -- formatter, rule sorter, later the linter.
// Compiled from source in its own source set; its meta-grammar is regenerated with our ANTLR
// so the plugin ships one runtime. Override the location with -Pantlr4XlDir=...
def xlDir = file(findProperty("antlr4XlDir") ?: "antlr4-xl")
if (!file("$xlDir/src/xl/Formatter.java").exists()) {
    throw new GradleException("antlr4-xl not found at $xlDir; run: git submodule update --init")
}
def xlTools = ["Formatter", "SortRules", "Linter", "GrammarSyntaxException"]
// The meta-grammar is moving from grammar/ to src/xl/ in antlr4-xl. Include exactly one copy:
// with -Xexact-output-dir both would generate into the same folder and the last would win.
def xlGrammar = ["src/xl/ANTLR4.g4", "grammar/ANTLR4.g4"].find { file("$xlDir/$it").exists() }

sourceSets {
    xl {
        antlr {
            srcDirs = [xlDir]
            include xlGrammar
        }
        java {
            srcDir "$xlDir/src"
            include xlTools.collect { "xl/${it}.java" }
            include "xl/ANTLR4*.java" // generated parser
        }
    }
}

generateXlGrammarSource {
    arguments += ["-package", "xl", "-visitor", "-Xexact-output-dir"]
    outputDirectory = layout.buildDirectory.dir("generated-src/antlr/xl/xl").get().asFile
}

jar {
    from sourceSets.xl.output.classesDirs // classes only; resources would duplicate plugin.xml
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { // Gets snapshots of antlr if needed
        url "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        create(platformType, platformVersion)
        testFramework(TestFrameworkType.Platform.INSTANCE)
    }
    antlr("org.antlr:antlr4:$antlr4Version") { // use ANTLR version 4
        exclude group:'com.ibm.icu', module:'icu4j'
    }
    implementation "org.antlr:antlr4-intellij-adaptor:0.1"
    xlImplementation "org.antlr:antlr4-runtime:$antlr4Version"
    compileOnly sourceSets.xl.output
    testImplementation sourceSets.xl.output
    implementation "org.jfree:org.jfree.svg:5.0.7"
    // The generation core, shared with the JPS builder, which the build process loads from
    // the same jar in lib/ (META-INF/antlr-jps.xml).
    implementation project(':jps-plugin')
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.20.0"
}

generateGrammarSource {
    include("**/ANTLRv4*.g4")

    arguments += [
            "-package", "org.antlr.intellij.plugin.parser",
            "-lib", "src/main/antlr/org/antlr/intellij/plugin/parser",
            "-Xexact-output-dir"
    ]
}

test {
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

runIde {
    jvmArgs '-Xmx8G'
}
